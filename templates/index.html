<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuesta Total - Ruleta en Vivo</title>
  <style>
    /* Estilos Apuesta Total y Fondo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0d0d11 url('/static/background.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Top Bar Apuesta Total */
    .top-header {
      background: rgba(20, 20, 23, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 14px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand-logo {
      font-weight: 900;
      font-size: 1.2rem;
      color: #ef4444;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-logo span {
      color: #ffffff;
    }

    .user-tag {
      font-size: 0.85rem;
      color: #a1a1aa;
      background: rgba(255,255,255,0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Card Estado y Tiempo */
    .status-card {
      background: rgba(20, 20, 23, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-estado {
      font-weight: 800;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-count {
      font-size: 1.5rem;
      font-weight: 900;
      color: #f59e0b;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    /* Card Saldo */
    .balance-card {
      background: linear-gradient(135deg, rgba(24, 24, 28, 0.95), rgba(15, 15, 18, 0.95));
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.1);
    }

    .balance-label {
      font-size: 0.75rem;
      color: #a1a1aa;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .balance-value {
      font-size: 2.2rem;
      font-weight: 900;
      color: #22c55e;
      margin-top: 4px;
      text-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
    }

    /* Tablero de Números (0-23) */
    .grid-roulette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      background: rgba(15, 15, 18, 0.8);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .num-btn {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      color: #ffffff;
      font-weight: 900;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .num-btn:active { transform: scale(0.92); }
    .num-btn.green { background: #16a34a; }
    .num-btn.red { background: #dc2626; }
    .num-btn.black { background: #27272a; }

    /* Modal Emergente Automático (5s) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #141417;
      border: 1px solid #3f3f46;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(239, 68, 68, 0.3);
      border-radius: 18px;
      padding: 25px 30px;
      width: 88%;
      max-width: 380px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transform: scale(0.7);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.show .modal-card {
      transform: scale(1);
    }

    .modal-title {
      color: #f59e0b;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .winning-number {
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1;
      margin: 12px 0 6px 0;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    .winning-color {
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .winning-info {
      font-size: 0.9rem;
      color: #a1a1aa;
      margin-top: 12px;
    }

    .winning-info .monto-total {
      color: #22c55e;
      font-weight: 700;
    }

    .modal-timer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: #ef4444;
      width: 100%;
    }

    @keyframes shrinkBar {
      from { width: 100%; }
      to { width: 0%; }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="top-header">
    <div class="brand-logo">APUESTA <span>TOTAL</span></div>
    <div class="user-tag">👤 {{ usuario }}</div>
    {% if es_admin %}
      <a href="/admin" style="color:#ef4444; text-decoration:none; font-weight:bold; font-size:0.85rem;">👑 Admin</a>
    {% endif %}
  </div>

  <div class="status-card">
    <div class="badge-estado" id="badge-estado">🔴 SALA CERRADA</div>
    <div class="timer-count" id="timer-count">--s</div>
  </div>

  <div class="balance-card">
    <div class="balance-label">MI SALDO DISPONIBLE</div>
    <div class="balance-value" id="saldo-usuario">S/ {{ saldo }}</div>
  </div>

  <div class="grid-roulette">
    <button class="num-btn green">0</button>
    {% for n in range(1, 24) %}
      {% if n in [1, 3, 5, 6, 8, 10, 13, 15, 17, 18, 20, 22] %}
        <button class="num-btn red">{{ n }}</button>
      {% else %}
        <button class="num-btn black">{{ n }}</button>
      {% endif %}
    {% endfor %}
  </div>
</div>

<div id="modal-resultado" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-title">🎉 RESULTADO DE RONDA 🎉</div>
    <div class="winning-number" id="res-numero">0</div>
    <div class="winning-color" id="res-color">VERDE</div>
    <p class="winning-info" id="res-info"></p>
    <div class="modal-timer-bar" id="timer-bar"></div>
  </div>
</div>

<script>
  let ultimaRondaMostrada = -1;
  let autoCloseTimeout = null;

  async function sincronizarEstado() {
    try {
      const res = await fetch('/estado_sala');
      if (!res.ok) return;
      const data = await res.json();

      const badgeEstado = document.getElementById('badge-estado');
      const timerCount = document.getElementById('timer-count');
      const saldoElem = document.getElementById('saldo-usuario');
      const modal = document.getElementById("modal-resultado");

      // 1. Sincronizar Saldo real devuelto por la API
      if (data.saldo_usuario !== undefined && data.saldo_usuario !== null && saldoElem) {
        saldoElem.innerText = `S/ ${parseFloat(data.saldo_usuario).toFixed(2)}`;
      }

      // 2. Si la sala se encuentra CERRADA
      if (!data.sistema_activo) {
        if (badgeEstado) {
          badgeEstado.innerHTML = "🔴 SALA CERRADA";
          badgeEstado.style.color = "#ef4444";
        }
        if (timerCount) timerCount.innerText = "--s";
        if (modal) modal.classList.remove("show");
        return;
      }

      // 3. Si la sala está ABIERTA
      if (badgeEstado) {
        badgeEstado.innerHTML = data.activa ? "🟢 APUESTAS ABIERTAS" : "🟡 GIRANDO RULETA";
        badgeEstado.style.color = data.activa ? "#22c55e" : "#f59e0b";
      }

      if (timerCount) {
        timerCount.innerText = `${data.tiempo_restante}s`;
      }

      // 4. Mostrar Pop-up emergente animado por 5s cuando haya un nuevo resultado
      if (data.ultimo_resultado && data.ultimo_resultado.numero_ronda !== ultimaRondaMostrada) {
        ultimaRondaMostrada = data.ultimo_resultado.numero_ronda;
        mostrarModal(data.ultimo_resultado);
      }

    } catch (e) {
      console.error("Error sincronizando estado:", e);
    }
  }

  function mostrarModal(resultado) {
    const numElem = document.getElementById("res-numero");
    const colorElem = document.getElementById("res-color");
    const infoElem = document.getElementById("res-info");
    const timerBar = document.getElementById("timer-bar");
    const modal = document.getElementById("modal-resultado");

    if (!modal) return;

    numElem.innerText = resultado.numero_ganador;
    colorElem.innerText = resultado.color_ganador.toUpperCase();

    const colorTexto = resultado.color_ganador.toLowerCase();
    colorElem.style.color = colorTexto === 'rojo' ? '#ef4444' : (colorTexto === 'verde' ? '#22c55e' : '#e4e4e7');

    const cantGanadores = resultado.ganadores ? resultado.ganadores.length : 0;
    const totalRepartido = resultado.total_repartido ? resultado.total_repartido.toFixed(2) : "0.00";
    
    infoElem.innerHTML = `<strong>${cantGanadores} ganadores</strong> obtuvieron <span class="monto-total">S/ ${totalRepartido}</span> en esta ronda.`;

    modal.classList.add("show");

    // Animación de la barra de 5 segundos
    if (timerBar) {
      timerBar.style.animation = 'none';
      timerBar.offsetHeight;
      timerBar.style.animation = 'shrinkBar 5s linear forwards';
    }

    if (autoCloseTimeout) clearTimeout(autoCloseTimeout);
    autoCloseTimeout = setTimeout(() => {
      modal.classList.remove("show");
    }, 5000);
  }

  document.addEventListener("DOMContentLoaded", () => {
    sincronizarEstado();
    setInterval(sincronizarEstado, 1000);
  });
</script>
</body>
</html>
