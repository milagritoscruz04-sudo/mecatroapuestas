<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mecatroapuestas</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --card-bg: #141417;
      --border: #222226;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --accent-black: #1c1c21;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .game-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .brand-title {
      color: #ef4444;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    /* Status Card */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-display {
      color: #f59e0b;
      font-size: 1.3rem;
      font-weight: 900;
    }

    /* Balance Card */
    .balance-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .balance-label {
      color: #a1a1aa;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .balance-amount {
      color: var(--accent-green);
      font-size: 2rem;
      font-weight: 900;
      margin-top: 4px;
    }

    /* Board Grid */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .board-btn {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid #2d2d35;
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s;
    }

    .board-btn:active { transform: scale(0.92); }
    .board-btn.green { background: #15803d; }
    .board-btn.red { background: #b91c1c; }
    .board-btn.black { background: #27272a; }

    /* Modal Emergente Automático */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.show { opacity: 1; visibility: visible; }

    .modal-card {
      background: #141417;
      border: 1px solid #27272a;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      padding: 25px 30px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transform: scale(0.7);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.show .modal-card { transform: scale(1); }

    .modal-title { color: #f59e0b; font-size: 1rem; font-weight: 800; }
    .winning-number { font-size: 4.5rem; font-weight: 900; line-height: 1; margin: 10px 0; }
    .winning-color { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }
    .winning-info { font-size: 0.85rem; color: #a1a1aa; margin-top: 10px; }
    .winning-info .monto-total { color: #22c55e; font-weight: 700; }

    .modal-timer-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 4px;
      background: #ef4444;
      width: 100%;
    }

    @keyframes shrinkBar {
      from { width: 100%; }
      to { width: 0%; }
    }
  </style>
</head>
<body>

<div class="game-container">
  <!-- Top Bar -->
  <div class="header-bar">
    <div class="brand-title">MECATROAPUESTAS</div>
    {% if es_admin %}
      <a href="/admin" style="color:#aaa; text-decoration:none; font-size:0.85rem;">👑 Admin</a>
    {% endif %}
  </div>

  <!-- Status -->
  <div class="status-card">
    <div class="status-badge" id="badge-estado">SALA CERRADA</div>
    <div class="timer-display" id="timer-display">--s</div>
  </div>

  <!-- Balance -->
  <div class="balance-card">
    <div class="balance-label">MI SALDO DISPONIBLE</div>
    <div class="balance-amount" id="saldo-usuario">S/ {{ saldo }}</div>
  </div>

  <!-- Tablero Ruleta (0-23) -->
  <div class="board-grid">
    <button class="board-btn green">0</button>
    {% for n in range(1, 24) %}
      {% if n in [1, 3, 5, 6, 8, 10, 13, 15, 17, 18, 20, 22] %}
        <button class="board-btn red">{{ n }}</button>
      {% else %}
        <button class="board-btn black">{{ n }}</button>
      {% endif %}
    {% endfor %}
  </div>
</div>

<!-- Modal Emergente (Animado + Cierre Auto 5s) -->
<div id="modal-resultado" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-title">🎉 RESULTADO DE RONDA 🎉</div>
    <div class="winning-number" id="res-numero">0</div>
    <div class="winning-color" id="res-color">VERDE</div>
    <p class="winning-info" id="res-info"></p>
    <div class="modal-timer-bar" id="timer-bar"></div>
  </div>
</div>

<script>
  let ultimaRondaMostrada = -1;
  let autoCloseTimeout = null;

  async function actualizarJuego() {
    try {
      const res = await fetch('/estado_sala');
      if (!res.ok) return;
      const data = await res.json();

      const badgeEstado = document.getElementById('badge-estado');
      const timerDisplay = document.getElementById('timer-display');
      const saldoElem = document.getElementById('saldo-usuario');
      const modal = document.getElementById("modal-resultado");

      // 1. Actualizar Saldo Real desde DB
      if (data.saldo_usuario !== undefined && data.saldo_usuario !== null && saldoElem) {
        saldoElem.innerText = `S/ ${parseFloat(data.saldo_usuario).toFixed(2)}`;
      }

      // 2. Si la sala está CERRADA
      if (!data.sistema_activo) {
        if (badgeEstado) {
          badgeEstado.innerHTML = "SALA CERRADA";
          badgeEstado.style.color = "#ef4444";
        }
        if (timerDisplay) timerDisplay.innerText = "--s";
        if (modal) modal.classList.remove("show");
        return;
      }

      // 3. Si la sala está ABIERTA
      if (badgeEstado) {
        badgeEstado.innerHTML = data.activa ? "APUESTAS ABIERTAS" : "🟡 GIRANDO RULETA";
        badgeEstado.style.color = data.activa ? "#22c55e" : "#f59e0b";
      }

      if (timerDisplay) {
        timerDisplay.innerText = `${data.tiempo_restante}s`;
      }

      // 4. Modal de Resultado (Sólo si la sala está activa y es una ronda nueva)
      if (data.ultimo_resultado && data.ultimo_resultado.numero_ronda !== ultimaRondaMostrada) {
        ultimaRondaMostrada = data.ultimo_resultado.numero_ronda;
        mostrarModalResultado(data.ultimo_resultado);
      }

    } catch (err) {
      console.error("Error sincronizando juego:", err);
    }
  }

  function mostrarModalResultado(resultado) {
    const numElem = document.getElementById("res-numero");
    const colorElem = document.getElementById("res-color");
    const infoElem = document.getElementById("res-info");
    const timerBar = document.getElementById("timer-bar");
    const modal = document.getElementById("modal-resultado");

    if (!modal) return;

    numElem.innerText = resultado.numero_ganador;
    colorElem.innerText = resultado.color_ganador.toUpperCase();

    const c = resultado.color_ganador.toLowerCase();
    colorElem.style.color = c === 'rojo' ? '#ef4444' : (c === 'verde' ? '#22c55e' : '#e4e4e7');

    const cantGanadores = resultado.ganadores ? resultado.ganadores.length : 0;
    const totalRepartido = resultado.total_repartido ? resultado.total_repartido.toFixed(2) : "0.00";
    
    infoElem.innerHTML = `<strong>${cantGanadores} ganadores</strong> obtuvieron <span class="monto-total">S/ ${totalRepartido}</span> en esta ronda.`;

    modal.classList.add("show");

    // Animación barra de 5 segundos
    if (timerBar) {
      timerBar.style.animation = 'none';
      timerBar.offsetHeight;
      timerBar.style.animation = 'shrinkBar 5s linear forwards';
    }

    if (autoCloseTimeout) clearTimeout(autoCloseTimeout);
    autoCloseTimeout = setTimeout(() => {
      modal.classList.remove("show");
    }, 5000);
  }

  document.addEventListener("DOMContentLoaded", () => {
    actualizarJuego();
    setInterval(actualizarJuego, 1000);
  });
</script>
</body>
</html>
