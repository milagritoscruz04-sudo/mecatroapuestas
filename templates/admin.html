<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <style>
    :root {
      --bg-dark: #0f0f12;
      --card-bg: #18181c;
      --card-border: #26262b;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .header-title {
      font-weight: 800;
      color: #ef4444;
      font-size: 1.1rem;
    }

    .btn-back {
      background: #27272a;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
    }

    .section-title {
      color: #f59e0b;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .room-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-room {
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0.5;
    }

    .btn-open { background: var(--accent-green); color: #000; }
    .btn-close { background: var(--accent-red); color: #fff; }

    .effects-container {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 18px 30px;
      display: flex;
      justify-content: space-around;
    }

    .toggle-group { display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .switch { position: relative; display: inline-block; width: 52px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3f3f46; transition: .3s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-red); }
    input:checked + .slider:before { transform: translateX(24px); }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { color: var(--text-muted); font-size: 0.8rem; padding: 12px 10px; border-bottom: 1px solid var(--card-border); }
    td { padding: 12px 10px; border-bottom: 1px solid #222226; font-size: 0.9rem; }
    .balance-text { color: var(--accent-green); font-weight: bold; }

    .reload-box { display: flex; gap: 6px; }
    .input-amount { background: #09090b; border: 1px solid #27272a; color: #fff; padding: 6px 10px; border-radius: 6px; width: 70px; text-align: right; }
    .btn-save { background: var(--accent-red); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="header-panel">
    <div class="header-title">👑 PANEL ADMINISTRACIÓN CREADORES</div>
    <a href="/" class="btn-back">← Volver al Juego</a>
  </div>

  <div class="section-card">
    <div class="section-title">⚡ Estado y Control de Sala en Vivo</div>
    <div class="room-controls">
      <button class="btn-room btn-open" id="btn-abrir" onclick="controlarSala(true)">ABRIR SALA</button>
      <button class="btn-room btn-close" id="btn-cerrar" onclick="controlarSala(false)">CERRAR SALA</button>
    </div>

    <div class="effects-container">
      <label class="toggle-group">
        <span>Sonido</span>
        <span class="switch">
          <input type="checkbox" id="toggle-sonido" checked onchange="toggleEfecto('Sonido', this.checked)">
          <span class="slider"></span>
        </span>
      </label>

      <label class="toggle-group">
        <span>Luces LED</span>
        <span class="switch">
          <input type="checkbox" id="toggle-led" checked onchange="toggleEfecto('Luces LED', this.checked)">
          <span class="slider"></span>
        </span>
      </label>
    </div>
  </div>

  <div class="section-card">
    <div class="section-title">👤 Control de Saldos de Usuarios</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Saldo Actual</th>
          <th>Recargar Saldo</th>
        </tr>
      </thead>
      <tbody>
        {% for u in usuarios %}
        <tr>
          <td><strong>{{ u.id }}</strong></td>
          <td>{{ u.username }}</td>
          <td class="balance-text" id="saldo-{{ u.id }}">S/ {{ u.saldo }}</td>
          <td>
            <div class="reload-box">
              <input type="number" step="0.5" class="input-amount" id="input-{{ u.id }}" value="{{ u.saldo }}">
              <button class="btn-save" onclick="guardarSaldo('{{ u.id }}', '{{ u.username }}')">Guardar</button>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const res = await fetch('/estado_sala');
      const data = await res.json();
      actualizarBotonesSala(data.sistema_activo);
    } catch (e) {}
  });

  async function controlarSala(abrir) {
    try {
      const res = await fetch('/api/sala/estado', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ abierta: abrir })
      });
      const data = await res.json();
      actualizarBotonesSala(data.abierta);
      alert(data.abierta ? "🚀 SALA ABIERTA" : "SALA CERRADA");
    } catch (e) { alert("Error al conectar con Render."); }
  }

  function actualizarBotonesSala(estaAbierta) {
    const btnAbrir = document.getElementById("btn-abrir");
    const btnCerrar = document.getElementById("btn-cerrar");
    if (estaAbierta) {
      btnAbrir.style.opacity = "1";
      btnAbrir.style.boxShadow = "0 0 15px rgba(34, 197, 94, 0.6)";
      btnCerrar.style.opacity = "0.4";
      btnCerrar.style.boxShadow = "none";
    } else {
      btnCerrar.style.opacity = "1";
      btnCerrar.style.boxShadow = "0 0 15px rgba(239, 68, 68, 0.6)";
      btnAbrir.style.opacity = "0.4";
      btnAbrir.style.boxShadow = "none";
    }
  }

  async function toggleEfecto(tipo, estado) {
    fetch('/api/esp32/efectos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tipo: tipo, estado: estado })
    });
  }

  async function guardarSaldo(idUsuario, nombreUsuario) {
    const input = document.getElementById(`input-${idUsuario}`);
    const elementoSaldo = document.getElementById(`saldo-${idUsuario}`);
    const nuevoMonto = parseFloat(input.value);

    if (isNaN(nuevoMonto) || nuevoMonto < 0) return alert("⚠️ Saldo inválido.");

    try {
      await fetch('/api/usuarios/saldo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: idUsuario, saldo: nuevoMonto })
      });
      elementoSaldo.innerText = `S/ ${nuevoMonto.toFixed(1)}`;
      alert(`✅ Saldo actualizado a S/ ${nuevoMonto.toFixed(1)}`);
    } catch (e) { alert("Error guardando saldo."); }
  }
</script>
</body>
</html>
