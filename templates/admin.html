<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MECATROAPUESTAS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #09090b; color: #f8fafc; padding: 20px; }
        
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #18181b; padding: 18px 22px; border-radius: 12px; border: 1px solid #27272a; }
        h1 { color: #ef4444; font-size: 20px; }
        
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 15px; font-weight: bold; color: #f59e0b; margin-bottom: 15px; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-control { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .btn-open { background: #22c55e; color: black; }
        .btn-close { background: #ef4444; color: white; }

        .toggle-box { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #09090b; border-radius: 8px; border: 1px solid #27272a; margin-top: 10px; font-size: 14px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #18181b; color: white; padding: 14px 20px; border-radius: 10px; border-left: 5px solid #22c55e; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(-10px); transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #27272a; font-size: 14px; }
        th { color: #a1a1aa; background: #09090b; }
        
        input[type="number"] { padding: 8px; background: #09090b; border: 1px solid #27272a; border-radius: 6px; color: white; width: 100px; }
        .btn-save { padding: 8px 12px; background: #dc2626; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-back { display: inline-block; padding: 10px 18px; background: #27272a; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div class="container">
        <div class="header">
            <h1>👑 PANEL ADMINISTRACIÓN CREADORES</h1>
            <a href="/" class="btn-back">⬅ Volver al Juego</a>
        </div>

        <div class="card">
            <div class="card-title">⚡ ESTADO Y CONTROL DE SALA EN VIVO</div>
            <div class="controls-grid">
                <button class="btn-control btn-open" onclick="abrirSala()">🚀 ABRIR SALA (Loop Continuo)</button>
                <button class="btn-control btn-close" onclick="cerrarSala()">🛑 CERRAR SALA</button>
            </div>

            <div style="margin-top: 15px;">
                <div class="toggle-box">
                    <span>Efecto Sonido ESP32</span>
                    <input type="checkbox" id="chk_sonido" {% if sonido %}checked{% endif %} onchange="actualizarEfectos()">
                </div>
                <div class="toggle-box">
                    <span>Efecto Luces LED ESP32</span>
                    <input type="checkbox" id="chk_luces" {% if luces %}checked{% endif %} onchange="actualizarEfectos()">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">👤 MODIFICAR SALDO DE USUARIOS</div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Saldo</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                    <tr>
                        <td><b>{{ u.id }}</b></td>
                        <td>{{ u.username }}</td>
                        <td style="color: #22c55e; font-weight: bold;">S/ {{ u.saldo }}</td>
                        <td>
                            <form method="POST" style="display: flex; gap: 8px;">
                                <input type="hidden" name="usuario_id" value="{{ u.id }}">
                                <input type="number" step="1" name="nuevo_saldo" value="{{ u.saldo }}">
                                <button type="submit" class="btn-save">Guardar</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function showToast(mensaje) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = 'toast';
            toast.innerText = mensaje;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add("show"), 10);
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function abrirSala() {
            const res = await fetch('/admin/abrir_sala', { method: 'POST' });
            const data = await res.json();
            showToast(data.message);
        }

        async function cerrarSala() {
            const res = await fetch('/admin/cerrar_sala', { method: 'POST' });
            const data = await res.json();
            showToast(data.message);
        }

        async function actualizarEfectos() {
            const sonido = document.getElementById("chk_sonido").checked;
            const luces = document.getElementById("chk_luces").checked;

            await fetch('/admin/efectos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sonido, luces })
            });
            showToast("Efectos guardados");
        }
    </script>
</body>
</html>
